services:
  mongodb:
    image: mongo:8.3
    container_name: mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - purchase-net

  kafka:
    image: apache/kafka:4.4.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - purchase-net
  
  api-server:
    image: api-server:test
    container_name: api-server
    ports:
      - 5000:5000
    environment:
      FRONTEND_URL: frontend:8000
      MONGO_URL: mongodb://mongodb:27017
      MONGO_DATABASE: purchase_system
    networks:
      - purchase-net
    depends_on:
      - mongodb

  kafka-consumer:
    image: kafka-consumer:test
    container_name: kafka-consumer
    environment:
      KAFKA_URL: kafka:9092
      API_SERVER_URL: http://api-server:5000/purchases
    networks:
      - purchase-net
    depends_on:
      - kafka
      - api-server

  client-server:
    image: client-server:test
    container_name: client-server
    environment:
      FRONTEND_URL: frontend:8000
      KAFKA_URL: kafka:9092
      API_SERVER_URL: http://api-server:5000/purchases
    networks:
      - purchase-net
    depends_on:
      - kafka
      - api-server

volumes:
  mongodb_data:

networks:
  purchase-net:
   driver: bridge